<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Mac 工具箱</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ============ 侧栏：品牌 + 本机 + 分区导航（导航由模块注册表渲染） ============ -->
  <aside class="side">
    <div class="side-head">
      <div class="wordmark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.5" y="4.5" width="7" height="7" rx="2" fill="currentColor" opacity=".55"/>
          <rect x="13.5" y="4.5" width="7" height="7" rx="2" fill="currentColor" opacity=".8"/>
          <rect x="3.5" y="14.5" width="7" height="5" rx="2" fill="currentColor" opacity=".8"/>
          <rect x="13.5" y="14.5" width="7" height="5" rx="2" fill="currentColor"/>
        </svg>
        <span id="brandName">Mac 工具箱</span>
        <span class="beat" id="beat"></span>
      </div>
      <div class="dev-mini">
        <div class="dev-name" id="devName">正在识别…</div>
        <div class="dev-sub" id="devSub">—</div>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="side-foot">
      <button class="run-chip" id="runMini" title="打开性能压测">
        <span class="rc-dot" id="rcDot"></span>
        <span class="rc-txt" id="rcTxt">就绪</span>
        <span class="rc-timer" id="rcTimer">00:00</span>
      </button>
      <div class="foot-meta"><span id="footVer">v3.0</span><span class="foot-sep">·</span><span>本地运行</span></div>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <main class="main">
    <header class="topbar">
      <div class="crumb" id="crumb">工具箱</div>
      <div class="tb-actions">
        <span class="clock" id="clock">--:--:--</span>
        <span class="ivl" id="ivl">250 ms</span>
        <button class="btn ghost icon" id="btnPin" title="窗口置顶">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 3.5l5 5-2 1.5-1.5 4.5-2-2-4 4-.5-.5 4-4-2-2L12 6.5l-1.5-2 1-1Z"/></svg>
        </button>
        <button class="btn ghost icon" id="btnCompact" title="紧凑模式">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="4" y="4" width="12" height="12" rx="2.5"/><path d="M4 8.5h12"/></svg>
        </button>
        <button class="btn ghost icon" id="btnSettings" title="设置 ⌘,">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <circle cx="10" cy="10" r="2.4"/>
            <path d="M10 2.6v2M10 15.4v2M2.6 10h2M15.4 10h2M4.8 4.8l1.4 1.4M13.8 13.8l1.4 1.4M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="pages" id="pages"></div>
  </main>
</div>

<!-- ============================================================
     模块视图模板 —— 新增功能 = 新增一个模板 + 在 app.js 注册表里加一项
     ============================================================ -->

<!-- 性能压测 -->
<template id="tpl-burn">
  <div class="grid-2">
    <section class="card">
      <div class="card-hd">
        <div><div class="card-t">压力模式</div><div class="card-sub">选一种负载，烤机台会按模式分配 CPU / GPU 核心</div></div>
      </div>
      <div class="card-bd">
        <div class="mode-list" id="modeList"></div>
        <p class="rec-hint" id="recHint"></p>
      </div>
    </section>

    <section class="card">
      <div class="card-hd"><div><div class="card-t">运行参数</div><div class="card-sub">时长与温度目标</div></div></div>
      <div class="card-bd">
        <div class="field">
          <span class="field-lbl">时长</span>
          <div class="dur-chips" id="durChips">
            <button data-d="0" class="on">手动</button>
            <button data-d="60">1分</button>
            <button data-d="180">3分</button>
            <button data-d="300">5分</button>
            <button data-d="600">10分</button>
            <input type="number" id="customDur" min="1" max="600" placeholder="自定义分钟" title="自定义分钟">
          </div>
        </div>
        <div class="field target" id="targetRow" hidden>
          <div class="target-head">
            <span class="field-lbl">目标温度</span>
            <span class="target-val"><input type="number" id="tVal" min="70" max="105" value="95"><i>°C</i></span>
          </div>
          <input type="range" class="slider" id="tSlider" min="70" max="105" step="1" value="95">
        </div>
        <div class="run-block">
          <button class="btn primary full" id="btnStart">开始烤机</button>
          <div class="run-row">
            <span class="num" id="timer">00:00</span>
            <span class="lbl" id="runState">就绪</span>
          </div>
          <div class="progress" id="progress"><span></span></div>
          <p class="kbd-hint"><kbd>⌘R</kbd> 开始 / 停手　<kbd>⌘,</kbd> 设置</p>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-hd"><div><div class="card-t">本轮峰值</div><div class="card-sub" id="runNote">尚未开始</div></div></div>
      <div class="card-bd">
        <div class="pk-grid">
          <div><span>CPU 温度</span><b id="pkCpu">—</b></div>
          <div><span>GPU 温度</span><b id="pkGpu">—</b></div>
          <div><span>芯片功耗</span><b id="pkAll">—</b></div>
          <div><span>整机功耗</span><b id="pkSys">—</b></div>
          <div><span>风扇最高</span><b id="pkFan">—</b></div>
          <div><span>P 核最低频</span><b id="pkFreq">—</b></div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-hd">
        <div><div class="card-t">本机纪录</div><div class="card-sub" id="histCount"></div></div>
        <button class="btn ghost tiny" id="btnClearHistory">清空纪录</button>
      </div>
      <div class="card-bd nopad">
        <table class="hist">
          <thead><tr><th>时间</th><th>模式</th><th>评级</th><th>CPU 峰值</th><th>功耗均值</th><th>时长</th></tr></thead>
          <tbody id="histBody"><tr class="empty"><td colspan="6">还没有记录，烤一轮就有了</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>
  <div class="compact-run" id="compactRun" hidden>
    <button class="btn primary" id="btnStart2">开始烤机</button>
  </div>
</template>

<!-- 实时监控 -->
<template id="tpl-monitor">
  <div class="page-bar">
    <div class="pb-note">卡片可自定义位置与大小：先进入编辑模式，再拖 ⠿ 交换、拖右下角 ⠓ 调宽高。</div>
    <button class="btn ghost tiny" id="btnEdit">编辑布局</button>
  </div>
  <div class="dashboard" id="dashboard">
    <div class="panel hero module" data-mod="hero-cpu" data-span="3">
      <span class="handle" title="拖动交换位置">⠿</span><span class="rz" title="拖拽调整宽高"></span>
      <div class="h-top"><span class="h-label">CPU 温度</span></div>
      <div class="h-value"><span id="hCpuTemp">--</span><i>°C</i></div>
      <canvas class="spark" id="sp1" height="34"></canvas>
    </div>
    <div class="panel hero module" data-mod="hero-gpu" data-span="3">
      <span class="handle" title="拖动交换位置">⠿</span><span class="rz" title="拖拽调整宽高"></span>
      <div class="h-top"><span class="h-label">GPU 温度</span></div>
      <div class="h-value"><span id="hGpuTemp">--</span><i>°C</i></div>
      <canvas class="spark" id="sp2" height="34"></canvas>
    </div>
    <div class="panel hero module" data-mod="hero-aw" data-span="3">
      <span class="handle" title="拖动交换位置">⠿</span><span class="rz" title="拖拽调整宽高"></span>
      <div class="h-top"><span class="h-label">芯片功耗</span></div>
      <div class="h-value"><span id="hAllW">--</span><i>W</i></div>
      <canvas class="spark" id="sp3" height="34"></canvas>
    </div>
    <div class="panel hero module" data-mod="hero-fan" data-span="3">
      <span class="handle" title="拖动交换位置">⠿</span><span class="rz" title="拖拽调整宽高"></span>
      <div class="h-top"><span class="h-label">风扇转速</span></div>
      <div class="h-value"><span id="hFan">--</span><i>RPM</i></div>
      <canvas class="spark" id="sp4" height="34"></canvas>
    </div>

    <section class="panel chart module" data-mod="temp" data-span="12" data-h="m">
      <span class="handle" title="拖动交换位置">⠿</span><span class="rz" title="拖拽调整宽高"></span>
      <header><span class="c-title" data-i18n="温度曲线" data-chart-title="temp">温度曲线</span>
        <div class="lg" id="lgTemp"></div>
        <div class="chart-sel"><select id="sTempA"></select><select id="sTempB"></select><select id="sTempC"></select></div>
      </header>
      <canvas id="cvTemp"></canvas>
    </section>

    <section class="panel chart module" data-mod="power" data-span="12" data-h="m">
      <span class="handle" title="拖动交换位置">⠿</span><span class="rz" title="拖拽调整宽高"></span>
      <header><span class="c-title" data-i18n="功耗曲线" data-chart-title="power">功耗曲线</span>
        <div class="lg" id="lgPower"></div>
        <div class="chart-sel"><select id="sPowerA"></select><select id="sPowerB"></select><select id="sPowerC"></select></div>
      </header>
      <canvas id="cvPower"></canvas>
    </section>

    <section class="panel chart module" data-mod="fan" data-span="12" data-h="m">
      <span class="handle" title="拖动交换位置">⠿</span><span class="rz" title="拖拽调整宽高"></span>
      <header><span class="c-title" data-i18n="风扇与频率" data-chart-title="fan">风扇与频率</span>
        <div class="lg" id="lgFan"></div>
        <div class="chart-sel"><select id="sFanA"></select><select id="sFanB"></select><select id="sFanC"></select></div>
      </header>
      <canvas id="cvFan"></canvas>
    </section>
  </div>

  <section class="card">
    <div class="card-hd"><div><div class="card-t">全部传感器</div><div class="card-sub">macmon 实时读数一览</div></div></div>
    <div class="card-bd"><div class="sensor-grid" id="sensorGrid"></div></div>
  </section>
</template>

<!-- 整机验机 -->
<template id="tpl-verify">
  <div class="v-actions">
    <button class="btn ghost tiny" id="btnReInspect">重新采集</button>
    <span class="v-gap"></span>
    <button class="btn ghost tiny" id="btnExportTxt">导出文本</button>
    <button class="btn ghost tiny" id="btnExportJson">导出 JSON</button>
  </div>
  <section class="card">
    <div class="card-bd">
      <div class="verify-body" id="verifyBody">
        <div class="verify-loading">正在采集整机信息…</div>
      </div>
    </div>
  </section>
</template>

<!-- Apple 内置诊断 -->
<template id="tpl-diag">
  <section class="card">
    <div class="card-bd">
      <div class="verify-body">
        <div class="diag-hero">
          <div class="diag-hero-t">Apple 内置诊断（Apple Diagnostics）</div>
          <div class="diag-hero-d">这是苹果官方的硬件自检，能查主板、内存、屏幕、电池、摄像头、传感器等部件是否正常，是软件层最有说服力的一步。</div>
        </div>

        <div class="diag-note accent">
          <b>Apple 芯片机型（M1 及以后）</b>：不能开机按 D，必须先<strong>完全关机</strong>，再<strong>长按电源键</strong>进入。下面按你的机型给步骤。
        </div>

        <div class="diag-steps">
          <div class="dstep"><span class="dn">1</span><div><b>先保存手上所有工作</b><div class="dd">进入诊断会重启电脑，没保存的文档会丢失。</div></div></div>
          <div class="dstep"><span class="dn">2</span><div><b>点下方按钮，让 App 帮你关机</b><div class="dd">关机过程中别合盖、别拔电源（插着电做诊断更准）。</div></div></div>
          <div class="dstep"><span class="dn">3</span><div><b>屏幕完全黑掉后，按住电源键不放</b><div class="dd">Touch ID 那个键，就是电源键。一直按住，大概 10 秒。</div></div></div>
          <div class="dstep"><span class="dn">4</span><div><b>看到 Apple 标志和转圈再松手</b><div class="dd">松早了会正常开机，等于白做，重新关机再来一次即可。</div></div></div>
          <div class="dstep"><span class="dn">5</span><div><b>出现语言选择界面就说明进来了</b><div class="dd">选「简体中文」→ 按提示点「诊断」，然后放着等，别碰键盘。</div></div></div>
          <div class="dstep"><span class="dn">6</span><div><b>2～5 分钟后出结果</b><div class="dd">显示「未发现问题」或 <b>ADP000</b> 就是全通过；出现其它代码（如 NDR、PPT、VDC、NDD 等）说明对应部件有故障，记下代码。</div></div></div>
        </div>

        <div class="diag-note">
          <b>Intel 机型</b>：关机后按电源键开机，听到启动音或看到灰屏时立刻按住 <b>D</b> 键，直到诊断界面出现。此入口对 Apple 芯片无效。
        </div>

        <div class="diag-warn">
          <b>注意：这一步会重启你的电脑。</b>必须由你本人确认后才会执行，App 不会自己重启。
        </div>

        <div class="diag-actions" id="diagActions">
          <button class="btn ghost" id="btnDiagCancel">先不做，返回整机验机</button>
          <button class="btn primary" id="btnDiagStart">关机并进入诊断</button>
        </div>

        <div class="diag-confirm" id="diagConfirm" hidden>
          <div class="dc-t">确认现在就重启进入诊断？</div>
          <div class="dc-d">请确认所有文件已保存。点击「确认重启」后，电脑会在约 1 秒内开始关机，之后请立刻按住电源键不放。</div>
          <div class="dc-btns">
            <button class="btn ghost tiny" id="btnDiagNo">取消</button>
            <button class="btn primary tiny danger" id="btnDiagYes">确认重启</button>
          </div>
        </div>

        <div class="diag-note">
          做完诊断回到系统后，建议再来这个页面导出一份报告，把诊断结果代码一起记下来，验机留档更完整。
        </div>
      </div>
    </div>
  </section>
</template>

<!-- 设置 -->
<template id="tpl-settings">
  <div class="grid-2">
    <section class="card">
      <div class="card-hd"><div><div class="card-t">外观</div><div class="card-sub">主题、强调色、图表配色、壁纸与密度</div></div></div>
      <div class="card-bd">
        <div class="row">
          <div class="row-label">主题<span class="row-sub">浅色 / 深色 / 跟随系统</span></div>
          <div class="seg" data-key="theme">
            <button data-v="auto">跟随系统</button><button data-v="light">浅色</button><button data-v="dark">深色</button>
          </div>
        </div>
        <div class="row col">
          <div class="row-label">强调色<span class="row-sub">按钮与选中态的颜色</span></div>
          <div class="swatches" id="accentSwatches"></div>
          <input type="range" class="slider hue" id="hueSlider" min="0" max="360" value="210">
          <div class="hue-row"><input type="color" id="accentCustom" class="colorpick"><span class="hue-val" id="hueVal">#0A84FF</span></div>
        </div>
        <div class="row col">
          <div class="row-label">图表配色<span class="row-sub">整套色系，或点色块逐条调</span></div>
          <div class="swatches big" id="chartSwatches"></div>
          <div class="series-colors" id="seriesColors"></div>
          <button class="btn ghost tiny" id="btnResetChart">恢复默认颜色</button>
        </div>
        <div class="picker" id="picker" hidden>
          <div class="picker-top">
            <canvas id="svPad" width="190" height="140"></canvas>
            <canvas id="hueBar" width="22" height="140"></canvas>
          </div>
          <div class="picker-bottom">
            <div class="picker-swatch" id="pickerSwatch"></div>
            <div class="picker-meta">
              <span class="hue-val" id="pickerHex">#0A84FF</span>
              <div class="picker-target" id="pickerTarget">强调色</div>
            </div>
          </div>
        </div>
        <div class="row col">
          <div class="row-label">壁纸<span class="row-sub">背景氛围，或用自己的图片</span></div>
          <div class="swatches wall" id="wallSwatches"></div>
          <button class="btn ghost tiny" id="btnPickWallpaper">选择自己的图片…</button>
        </div>
        <div class="row">
          <div class="row-label">玻璃透明度<span class="row-sub" id="glassVal">72%</span></div>
          <input type="range" class="slider" id="glassSlider" min="20" max="100" step="2">
        </div>
        <div class="row">
          <div class="row-label">字体大小<span class="row-sub" id="fontVal">13 px</span></div>
          <input type="range" class="slider" id="fontSlider" min="11" max="18" step="1">
        </div>
        <div class="row">
          <div class="row-label">界面密度<span class="row-sub">字号与间距</span></div>
          <div class="seg" data-key="density">
            <button data-v="compact">紧凑</button><button data-v="standard">标准</button><button data-v="relaxed">宽松</button>
          </div>
        </div>
        <div class="row">
          <div class="row-label">侧栏宽度<span class="row-sub">左侧导航宽窄</span></div>
          <div class="seg" data-key="sideWidth">
            <button data-v="220">窄</button><button data-v="252">标准</button><button data-v="288">宽</button>
          </div>
        </div>
        <div class="row">
          <div class="row-label">圆角大小<span class="row-sub">卡片与控件圆角</span></div>
          <div class="seg" data-key="radius">
            <button data-v="8">小</button><button data-v="14">中</button><button data-v="20">大</button>
          </div>
        </div>
        <div class="row">
          <div class="row-label">曲线线宽<span class="row-sub">图表的线条粗细</span></div>
          <div class="seg" data-key="chartLine">
            <button data-v="1.2">细</button><button data-v="1.6">中</button><button data-v="2.2">粗</button>
          </div>
        </div>
        <div class="row">
          <div class="row-label">曲线面积填充<span class="row-sub">线条下方的渐变阴影</span></div>
          <input type="checkbox" class="sw" id="setFill">
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-hd"><div><div class="card-t">采样与压测</div><div class="card-sub">数据刷新与线程分配</div></div></div>
      <div class="card-bd">
        <div class="row">
          <div class="row-label">采样间隔<span class="row-sub">越小越丝滑</span></div>
          <div class="seg" data-key="interval">
            <button data-v="250">250 ms</button><button data-v="500">500 ms</button><button data-v="1000">1 s</button>
          </div>
          <input type="number" id="customIvl" min="100" max="5000" step="50" placeholder="自定义 ms" class="num-in">
        </div>
        <div class="row">
          <div class="row-label">图表窗口<span class="row-sub">横轴显示多长</span></div>
          <div class="seg" data-key="windowSec">
            <button data-v="30">30 s</button><button data-v="60">1 min</button><button data-v="180">3 min</button><button data-v="600">10 min</button>
          </div>
        </div>
        <div class="row">
          <div class="row-label">显示峰值参考线</div>
          <input type="checkbox" class="sw" id="setPeak">
        </div>
        <div class="row">
          <div class="row-label">CPU 线程数<span class="row-sub" id="thrVal">自动（按模式）</span></div>
          <input type="range" class="slider" id="setThreads" min="0" max="16" step="1">
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-hd"><div><div class="card-t">安全</div><div class="card-sub">温度熔断与睡眠保护</div></div></div>
      <div class="card-bd">
        <div class="row">
          <div class="row-label">温度保险丝<span class="row-sub">到温度自动收手</span></div>
          <input type="checkbox" class="sw" id="setFuse">
        </div>
        <div class="row">
          <div class="row-label">熔断阈值<span class="row-sub" id="fuseVal">108 °C</span></div>
          <input type="range" class="slider" id="setFuseTemp" min="90" max="115" step="1">
        </div>
        <div class="row">
          <div class="row-label">烤机时防止睡眠<span class="row-sub">压测期间自动生效，无需手动开</span></div>
          <span class="row-val">始终开启</span>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-hd"><div><div class="card-t">通用</div><div class="card-sub">语言、启动项与数据导出</div></div></div>
      <div class="card-bd">
        <div class="row">
          <div class="row-label">语言<span class="row-sub">Language</span></div>
          <div class="seg" data-key="lang">
            <button data-v="auto">跟随系统</button><button data-v="zh">中文</button><button data-v="en">English</button>
          </div>
        </div>
        <div class="row">
          <div class="row-label">登录时启动</div>
          <input type="checkbox" class="sw" id="setLogin">
        </div>
        <div class="row">
          <div class="row-label">本轮采样导出<span class="row-sub">存成 CSV 自己画图</span></div>
          <button class="btn ghost tiny" id="btnExport2">导出</button>
        </div>
        <div class="row">
          <div class="row-label">恢复默认设置</div>
          <button class="btn ghost tiny" id="btnReset">恢复</button>
        </div>
      </div>
    </section>
  </div>
</template>

<!-- 关于本机 -->
<template id="tpl-about">
  <div class="grid-2">
    <section class="card">
      <div class="card-hd"><div><div class="card-t">本机信息</div><div class="card-sub">实时读取的硬件概况</div></div></div>
      <div class="card-bd">
        <dl class="specs" id="specsBox">
          <div><dt>芯片 · 核心</dt><dd id="spChip">—</dd></div>
          <div><dt>图形</dt><dd id="spGpu">—</dd></div>
          <div><dt>内存</dt><dd id="spMem">—</dd></div>
          <div><dt>磁盘</dt><dd id="spDisk">—</dd></div>
          <div><dt>散热</dt><dd id="spFan">—</dd></div>
          <div><dt>供电</dt><dd id="spPower">—</dd></div>
        </dl>
        <div class="hw-grid" id="hwGrid"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-hd"><div><div class="card-t">应用</div><div class="card-sub">版本与数据源</div></div></div>
      <div class="card-bd">
        <div class="row"><div class="row-label">版本</div><span class="row-val" id="aboutVer">3.0.0</span></div>
        <div class="row"><div class="row-label">处理器</div><span class="row-val" id="aboutChip">—</span></div>
        <div class="row"><div class="row-label">数据源</div><span class="row-val" id="aboutSrc">—</span></div>
        <div class="row">
          <div class="row-label">监控卡片布局<span class="row-sub">大小与位置</span></div>
          <button class="btn ghost tiny" id="btnResetLayout">重置布局</button>
        </div>
        <div class="row">
          <div class="row-label">部件与服务历史<span class="row-sub">官方换件记录</span></div>
          <button class="btn ghost tiny" id="btnParts2">打开系统信息</button>
        </div>
      </div>
    </section>
  </div>
</template>

<!-- ============ 成绩单 ============ -->
<div class="sheet-wrap" id="sheet">
  <div class="sheet report">
    <div class="sheet-head">
      <div class="grade" id="rGrade">A</div>
      <div class="grow">
        <div class="sheet-title" id="rMode">成绩单</div>
        <div class="sheet-sub" id="rDesc">—</div>
      </div>
      <div class="record-tag" id="rRecord">新纪录</div>
    </div>
    <div class="sheet-grid" id="rGrid"></div>
    <div class="badges" id="rBadges"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="btnCopy">拷贝成绩</button>
      <button class="btn ghost" id="btnImage">存为图片</button>
      <button class="btn primary" id="btnAgain">收工</button>
    </div>
  </div>
</div>

<!-- ============ 图表全屏 ============ -->
<div class="zoom-wrap" id="zoomWrap">
  <div class="zoom-panel">
    <div class="zoom-head">
      <span class="c-title big" id="zoomTitle">温度曲线</span>
      <div class="lg" id="zoomLegend"></div>
      <button class="close-btn" id="btnCloseZoom" title="关闭 Esc">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
      </button>
    </div>
    <div class="zoom-body"><canvas id="zoomCanvas"></canvas></div>
    <div class="zoom-hint">双指捏合缩放 · 拖动平移 · Esc 关闭</div>
  </div>
</div>

<div class="ctx-menu" id="ctxMenu" hidden></div>
<div class="toasts" id="toasts"></div>
<div class="banner" id="banner"></div>

<script>
window.onerror = function(m,s,l,c){ try{ window.webkit.messageHandlers.api.postMessage({op:'jserror', msg:m+' @'+l+':'+c}); }catch(_){} };
</script>
<script src="app.js"></script>
</body>
</html>
